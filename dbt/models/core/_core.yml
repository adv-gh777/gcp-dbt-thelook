models:
  - name: core_order_items
    description: One row per order item with order context and net revenue rule.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
      - name: item_status
        data_tests:
          - accepted_values:
              arguments:
                values: [ordered, processing, shipped, complete, cancelled, returned]
  - name: core_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: core_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
